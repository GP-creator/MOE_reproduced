# smoke config. Every key is listed explicitly (no hidden defaults). See docs/CONFIG_SCHEMA.md.
name: smoke                 # smoke | small | main
seed: 1337
variant: dense             # filled in by train.py from --variant (dense|switch|deepseek|gshard|dense_x8)

data:
  dataset: tinystories     # tinystories | shakespeare (fallback if download fails)
  vocab_size: 8192         # shared by all configs (one tokenizer)
  cache_dir: data_cache    # relative to repo root; gitignored
  tokenizer_train_stories: 200000   # stories used to train BPE (same for all configs)
  max_train_tokens: 2000000  # cap on cached train tokens
  max_val_tokens: 200000    # cap on cached val tokens

model:
  n_layers: 2
  d_model: 64
  n_heads: 2
  seq_len: 64
  d_ff: 256               # base dense FFN width (4 x d_model)
  moe_every: 1             # 1 = every FFN is the variant's FFN; 2 = every other layer
  init: switch             # switch: truncnormal(+-2 sigma), sigma = sqrt(init_scale / fan_in) | deepseek: std 0.006
  init_scale: 0.1          # Switch Sec. 2.4 reduced init scale s
  norm_eps: 1.0e-6
  rope_base: 10000

moe:
  dispatch: batched        # loop | batched (identical math; loop is the readable reference)
  renormalize_gates: false # both papers use raw softmax prob as gate
  switch:
    n_experts: 8
    capacity_factor: 1.25
    eval_capacity_factor: null   # null = same as capacity_factor
    aux_alpha: 0.01
    jitter_eps: 0.01             # Switch App. C, train only, multiplies router input
  gshard:
    n_experts: 16                # 16 x d_ff/2, top-2 (8x total, 1x active)
    width_divisor: 2             # expert width = d_ff / width_divisor
    top_k: 2
    capacity_factor: 1.25
    eval_capacity_factor: null
    aux_alpha: 0.01
    jitter_eps: 0.0
  deepseek:
    m: 4                         # fine-grained segmentation: expert width = d_ff / m
    n_shared: 1
    n_routed: 31
    k_routed: 3
    aux_alpha: 0.01              # expert-level balance alpha1 (Eqs. 12-14)
    device_aux_alpha: 0.0        # device-level balance alpha2 (Eqs. 15-17), off by default
    n_devices: 1                 # only used when device_aux_alpha > 0
    jitter_eps: 0.0
  dense_x8:
    width_mult: 8                # FFN width = width_mult * d_ff

train:
  batch_size: 16               # sequences per step; tokens/step = batch_size * seq_len
  total_steps: 150
  warmup_steps: 15
  peak_lr: 3.0e-3
  lr_decay_points: [0.8, 0.9]  # fractions of total_steps
  lr_decay_factor: 0.316
  betas: [0.9, 0.95]
  weight_decay: 0.1            # matrices only (not norms, embedding, router)
  grad_clip: 1.0
  eval_interval: 50
  eval_batches: 4
  routing_log_interval: 10
  checkpoint_interval: 0     # 0 = only final checkpoint
  log_interval: 1
  compile: false

system:
  device: cpu                 # auto | cuda | mps | cpu (auto: cuda -> mps -> cpu)
  dtype: fp32                  # auto | bf16 | fp32 (auto: bf16 autocast if cuda supports it, else fp32)
  cpu_threads: 8
  results_dir: results
